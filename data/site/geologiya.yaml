# Направление «Инженерная геология» (design/handoff/pages/geologiya.md — шаблон страницы направления).
# Контент — демо из прототипа; цены — метки движка.
direction: geologiya
h1: Инженерно-геологические изыскания
lead: Узнаём, что лежит под пятном застройки и как грунт поведёт себя под нагрузкой.
passport:
  - { key: Цена, value: "{{от:geo_dom}}" }
  - { key: Срок, value: "от 7 рабочих дней" }
  - { key: Норматив, norm: "СП 47.13330.2016" }
calc: "raschet?s=dom"
objects:
  title: Для каких объектов
  items:
    - { title: Частные дома, text: "Дома, бани, гаражи. Три скважины по контуру пятна застройки.", price: "{{от:geo_dom}}" }
    - { title: Многоквартирные дома, text: "Полный комплекс под экспертизу, статическое зондирование.", price: по ТЗ }
    - { title: Промышленные объекты, text: "Склады, цеха, фундаменты под оборудование.", price: по ТЗ }
    - { title: Линейные объекты, text: "Газопроводы, дороги, ЛЭП, сети водоснабжения.", price: "{{от:geo_linear}}" }
stages:
  title: Что входит
  rows:
    - { stage: Полевые работы, what: "Бурение скважин, отбор проб грунта и воды, статическое зондирование", norm: "СП 446.1325800.2019" }
    - { stage: Лабораторные испытания, what: "Физико-механические свойства, коррозионная агрессивность", norm: "ГОСТ 5180-2015" }
    - { stage: Камеральная обработка, what: "Выделение инженерно-геологических элементов, разрезы, колонки", norm: "ГОСТ 20522-2012" }
    - { stage: Технический отчёт, what: "Отчёт с рекомендациями для проектировщика, в бумаге и PDF", norm: "СП 47.13330.2016" }
volume:
  title: Типовой объём
  note: Окончательный объём задаёт программа работ по СП 47.13330.2016 после изучения архивных данных и выезда на участок.
  rows:
    - { object: "Баня, гараж", profile: geo_light }
    - { object: "Одноэтажный дом до 100 м²", profile: geo_dom }
    - { object: "Двухэтажный дом до 200 м²", profile: geo_2fl_200 }
    - { object: Дом с подвалом, profile: geo_basement_10x12 }
    - { object: Малоэтажный МКД, boreholes: "6–10", depth: "15–20 м", price: "{{от:mkd}}" }
timeline:
  title: Этапы и сроки
  items:
    - { term: День 1, title: Договор, text: "Фиксируем цену и срок, согласуем выезд." }
    - { term: День 2–3, title: Бурение, text: "Буровая бригада работает на участке 1 день." }
    - { term: День 3–7, title: Лаборатория, text: "Испытываем пробы в своей лаборатории." }
    - { term: День 7–9, title: Отчёт, text: "Разрезы, колонки, рекомендации по фундаменту." }
    - { term: После, title: Сопровождение, text: "Отвечаем на вопросы проектировщика и эксперта." }
samples:
  - { type: Разрез, title: Инженерно-геологический разрез, meta: "Отчёт № 214-ИГИ" }
  - { type: Колонка, title: Колонка скважины, meta: "Отчёт № 214-ИГИ" }
  - { type: Протокол, title: Протокол испытаний, meta: ГОСТ 5180-2015 }
case:
  kicker: "Кейс · Частный дом · Нежинка"
  title: Дом 10 × 12 м на склоне
  text: "Проект предполагал ленточный фундамент. Четыре скважины по 10 м показали линзу торфа на глубине 2,6 м под одним из углов. Заказчик перешёл на сваи до плотного суглинка и не стал заменять грунт по всему пятну."
  facts:
    - { value: "4 × 10 м", label: скважины }
    - { value: "8 дней", label: до отчёта }
    - { value: "380 тыс. ₽", label: экономия заказчика }
faq:
  - { q: Можно ли обойтись без геологии?, a: "Для ИЖС закон этого не требует. Но фундамент без данных о грунте либо закладывают с большим запасом, либо рискуют трещинами и осадкой." }
  - { q: Почему скважин три, а не одна?, a: "Грунт меняется даже в пределах пятна дома. Три скважины по контуру показывают, одинаково ли он лежит под всем фундаментом." }
  - { q: Что делать зимой?, a: "Бурим круглый год. Зимой нужен расчищенный подъезд для буровой установки." }
  - { q: Отчёт подходит для банка и экспертизы?, a: "Да, отчёт оформляем по СП 47.13330.2016 — его принимают банки, проектировщики и экспертиза." }
  - { q: Можно ли присутствовать при бурении?, a: "Да, предупредите инженера — согласуем время." }
related:
  - { label: Топосъёмка участка, r: topo-gaz }
  - { label: Защита от подтопления, r: uslugi }
  - { label: Обследование фундамента, r: uslugi }
  - { label: Экологические изыскания, r: uslugi }
