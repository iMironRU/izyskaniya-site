# Услуга «Топосъёмка для подключения газа» (design/handoff/pages/topo-gaz.md — шаблон страницы услуги).
direction: geodeziya
crumb: Для газа
h1: Топосъёмка для подключения газа
lead: Топографический план участка М 1:500, который газовая служба требует для проекта газификации дома.
price: "{{от:topo_gaz}}"
days: "{{срок:topo_gaz}}"
norm: "СП 317.1325800.2017"
calc: "raschet?s=topo"
when:
  - Газифицируете дом и газовая служба запросила топоплан
  - Проводите воду или канализацию от центральных сетей
  - Нужен план для проекта дома или ландшафта
  - Покупаете участок и хотите знать рельеф и сети
result:
  - { key: Документ, value: "Инженерно-топографический план М 1:500" }
  - { key: Формат, value: "PDF, DWG и бумажный экземпляр с печатью" }
  - { key: Для кого, value: "Газораспределительная организация, проектировщик" }
  - { key: Система координат, value: "[местная система координат], Балтийская система высот" }
need:
  - { title: Кадастровый номер или адрес, text: Чтобы найти участок и запросить сведения о сетях }
  - { title: Доступ на участок, text: На 2–3 часа в согласованный день }
  - { title: "Технические условия, если есть", text: Покажут, где планируется точка врезки }
prices:
  - { what: Участок до 10 соток, price: "{{цена:topo_gaz}}", note: Типовой участок ИЖС в черте города или СНТ }
  - { what: Участок до 30 соток, price: "{{цена:topo_gaz_30}}", note: Больше пикетов и дольше камеральная обработка }
  - { what: Трасса до сети, price: "{{от:topo_linear}}", note: Если газопровод проходит за границей участка }
  - { what: Быстрее обычного, price: "{{v:urgent}}", note: Выезд на следующий рабочий день }
travel: "Выезд в пределах {{v:free_km}} от офиса входит в цену. Дальше — по зонам выезда на странице «Цены»."
timeline:
  - { term: День 1, title: Заявка и договор, text: "Онлайн или в офисе, оплата после выезда." }
  - { term: День 2, title: Съёмка на участке, text: "Геодезист работает 2–3 часа." }
  - { term: День 3–4, title: План и согласование, text: "Чертим план и наносим сети." }
  - { term: День 5, title: Выдача, text: "PDF на почту, бумажный экземпляр в офисе." }
sample:
  title: Топоплан М 1:500 для газовой службы
  text: "Рельеф в горизонталях через 0,5 м, контуры построек, подземные и надземные сети, точка врезки газопровода."
faq:
  - { q: Сколько действует топосъёмка?, a: "Газовая служба обычно принимает план не старше одного-двух лет. Если на участке что-то построили, съёмку нужно обновить." }
  - { q: Нужно ли моё присутствие?, a: "Достаточно открыть доступ на участок. Присутствовать не обязательно." }
  - { q: Сдадите план в газовую службу сами?, a: "Да, можем согласовать план с газовой службой — это отдельная строка в расчёте." }
  - { q: Можно ли снимать зимой?, a: "Да. При глубоком снеге часть сетей уточняем по данным эксплуатирующих служб." }
related:
  - { label: Геология под дом, r: "raschet?s=dom" }
  - { label: Вынос границ участка, r: "raschet?s=granicy" }
  - { label: Исполнительная съёмка, r: uslugi }
factors:
  title: Что влияет на стоимость
  rows:
    - { factor: Площадь участка или длина трассы, effect: "Базовая единица расчёта: ₽/га для участка, ₽/км для трассы" }
    - { factor: Масштаб, effect: "1:500 детальнее и дороже, 1:1000–1:2000 — для больших территорий" }
    - { factor: Застроенность, effect: "Постройки, ограждения, деревья — больше точек съёмки и работы в камерале" }
    - { factor: Подземные коммуникации, effect: "Поиск и съёмка сетей — отдельный объём работ" }
    - { factor: Согласование с эксплуатирующими службами, effect: "Отдельная строка в расчёте за каждую службу" }
    - { factor: Исходные данные, effect: "Съёмки прошлых лет и пункты геодезической сети рядом сокращают полевые работы" }
    - { factor: Удалённость объекта, effect: "Выезд считается по зонам от офиса — см. страницу «Цены»" }
    - { factor: Срочность, effect: "Работа в сжатые сроки — {{v:urgent}} к стоимости" }
