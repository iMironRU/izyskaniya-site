# Страница «О компании». Контент — демо из прототипа дизайнера (design/handoff/prototype/pages-data.js, ключ o-kompanii).
# Цены — метки {{от:профиль}}, {{цена:профиль}}, {{срок:профиль}}: их считает движок по data/site/prices.yaml.
# Схема блоков — src/site/blocks.ts; ссылки r: — ключи маршрутов из src/site/routes.ts.

title: О компании
blocks:
  - type: hero
    crumbs:
      - - Главная
        - home
      - О компании
    h1: О компании
    lead: Изыскательская компания из Екатеринбурга. С 2009 года бурим своей техникой и испытываем грунты в своей лаборатории.
  - type: kv
    title: Паспорт компании
    items:
      - - Год основания
        - '2009'
      - - СРО
        - '{{sro}}, НОПРИЗ'
      - - Лаборатория
        - Аттестат аккредитации {{lab}}
      - - Система качества
        - ISO 9001:2015
      - - Техника
        - 4 буровые установки, 6 GNSS-приёмников
      - - Объектов
        - 1 240
      - - Регионы
        - Екатеринбург и 14 районов области
      - - Сроки
        - от 3 рабочих дней
      - - Контакты
        - '{{phone}}, {{email}}'
  - type: stats
    title: Цифры по годам
    items:
      - v: '48'
        k: сотрудников
      - v: 9 800 м
        k: бурения в 2025
      - v: '310'
        k: объектов в 2025
    years:
      - - 2020
        - 5400
      - - 2021
        - 6100
      - - 2022
        - 7300
      - - 2023
        - 8000
      - - 2024
        - 9100
      - - 2025
        - 9800
  - type: cards
    title: Подробнее
    min: 240
    items:
      - t: Команда
        d: Инженеры, геологи, геодезисты
        r: komanda
      - t: Лаборатория
        d: Аттестат, испытания, оборудование
        r: laboratoriya
      - t: Техника
        d: Буровые установки и геодезия
        r: tehnika
      - t: Документы
        d: СРО, реквизиты, карточка
        r: dokumenty
  - type: logos
    title: Заказчики и партнёры
    'n': 8
