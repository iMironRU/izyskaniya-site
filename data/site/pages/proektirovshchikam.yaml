# Страница «Проектировщикам». Контент — демо из прототипа дизайнера (design/handoff/prototype/pages-data.js, ключ proektirovshchikam).
# Цены — метки {{от:профиль}}, {{цена:профиль}}, {{срок:профиль}}: их считает движок по data/site/prices.yaml.
# Схема блоков — src/site/blocks.ts; ссылки r: — ключи маршрутов из src/site/routes.ts.

title: Проектировщикам
blocks:
  - type: hero
    crumbs:
      - - Главная
        - home
      - Проектировщикам
    h1: Изыскания под проект и экспертизу
    lead: Комплексные изыскания своими силами. Отчёты по СП 47.13330.2016, сопровождение экспертизы, снятие замечаний без доплат.
    form: tz
  - type: tz
    id: tz
    title: Пришлите ТЗ — посчитаем состав работ и стоимость
    lead: Подойдёт техническое задание, программа изысканий или просто описание объекта. Чем больше исходных данных, тем точнее расчёт.
    items:
      - Техническое задание или программа изысканий (PDF, Word)
      - Границы объекта — KML/KMZ, DWG/DXF, координаты в CSV/Excel или скриншот карты
      - Ситуационный план, схема планировочной организации участка
      - Материалы изысканий прошлых лет, если есть — сокращают объём полевых работ
  - type: rows
    title: Что гарантируем
    note: Условия подтверждает заказчик до публикации.
    items:
      - t: Отчёт по действующим СП и ГОСТ
        d: Состав и оформление по СП 47.13330.2016 и СП 446.1325800.2019
      - t: Сопровождение экспертизы
        d: Отвечаем на замечания эксперта в течение 3 рабочих дней
      - t: Снятие замечаний без доплат
        d: Закреплено в договоре
      - t: Фиксированный срок
        d: Неустойка 0,1% за каждый день просрочки
  - type: table
    title: Комплексные изыскания
    sub: Какие виды выполняем своими силами. Пакет из трёх и более видов — скидка 15%.
    cols:
      - Вид изысканий
      - Исполнитель
      - Норматив
    rows:
      - - Инженерно-геологические
        - свои силы
        - СП 446.1325800.2019
      - - Инженерно-геодезические
        - свои силы
        - СП 317.1325800.2017
      - - Инженерно-экологические
        - свои силы
        - СП 502.1325800.2021
      - - Инженерно-гидрометеорологические
        - партнёр
        - СП 482.1325800.2020
      - - Геофизические
        - свои силы
        - СП 11-105-97
    normCol: 2
  - type: table
    title: Сроки по видам
    cols:
      - Вид
      - Полевые
      - Лаборатория
      - Отчёт
      - Итого
    rows:
      - - Геология, МКД до 9 эт.
        - 5 дней
        - 10 дней
        - 7 дней
        - 22 дня
      - - Геодезия, 1 га
        - 2 дня
        - —
        - 3 дня
        - 5 дней
      - - Экология
        - 3 дня
        - 14 дней
        - 5 дней
        - 22 дня
      - - Геофизика
        - 2 дня
        - —
        - 4 дня
        - 6 дней
  - type: docs
    title: Документы для тендера
    all: Скачать всё одним архивом, 4,2 МБ
    items:
      - t: Выписка из реестра СРО
        m: PDF · 0,4 МБ
      - t: Аттестат аккредитации лаборатории
        m: PDF · 1,1 МБ
      - t: Сертификат ISO 9001
        m: PDF · 0,6 МБ
      - t: Карточка предприятия
        m: PDF · 0,2 МБ
  - type: cards
    title: Образцы
    link:
      t: Все образцы
      r: obrazcy
    min: 220
    items:
      - kicker: Разрез
        t: Инженерно-геологический разрез
        ph: скан разреза
        r: obrazcy
      - kicker: Колонка
        t: Колонка скважины
        ph: скан колонки
        r: obrazcy
      - kicker: Протокол
        t: Протокол испытаний
