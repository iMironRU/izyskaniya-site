# Схема блоков — src/site/blocks.ts; ссылки r: — ключи маршрутов из src/site/routes.ts.

title: Контакты
blocks:
  - type: hero
    crumbs:
      - - Главная
        - home
      - Контакты
    h1: Контакты
  - type: contacts
  - type: kv
    title: Реквизиты кратко
    items:
      - - '{{legal_name}}'
        - ИНН {{inn}}, ОГРН {{ogrn}}
