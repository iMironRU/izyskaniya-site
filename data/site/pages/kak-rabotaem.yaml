# Страница «Как мы работаем». Контент — демо из прототипа дизайнера (design/handoff/prototype/pages-data.js, ключ kak-rabotaem).
# Цены — метки {{от:профиль}}, {{цена:профиль}}, {{срок:профиль}}: их считает движок по data/site/prices.yaml.
# Схема блоков — src/site/blocks.ts; ссылки r: — ключи маршрутов из src/site/routes.ts.

title: Как мы работаем
blocks:
  - type: hero
    crumbs:
      - - Главная
        - home
      - Как мы работаем
    h1: Как мы работаем
    lead: 'От заявки до отчёта: что делаем мы, что нужно от вас и сколько это занимает.'
  - type: timeline
    title: Этапы
    you: true
    items:
      - w: День 1
        t: Заявка и расчёт
        d: Считаем состав работ и цену
        you: Кадастровый номер, габариты дома
      - w: День 1–2
        t: Договор
        d: Фиксируем цену, срок и состав
        you: Паспорт или реквизиты
      - w: День 2–3
        t: Выезд
        d: Бурение, съёмка, отбор проб
        you: Доступ на участок
      - w: День 3–7
        t: Лаборатория
        d: Испытания проб
        you: —
      - w: День 7–9
        t: Отчёт
        d: PDF и бумажный экземпляр
        you: Оплата второй части
  - type: docs
    title: Договор
    items:
      - t: Образец договора для физлиц
        m: DOCX · 0,1 МБ
      - t: Образец договора для юрлиц
        m: DOCX · 0,1 МБ
  - type: table
    title: Оплата
    cols:
      - Кто
      - Схема
      - Способ
    rows:
      - - Физлица
        - 50% после выезда, 50% при получении отчёта
        - Карта, СБП, перевод
      - - Юрлица
        - По этапам договора
        - Безналичный расчёт с НДС
      - - Бюджет
        - По 44-ФЗ / 223-ФЗ
        - По контракту
  - type: rows
    title: Гарантии в договоре
    items:
      - t: Фиксированная цена
        d: Изменение только по письменному согласованию
      - t: Срок с неустойкой
        d: 0,1% за каждый день просрочки
      - t: Снятие замечаний экспертизы
        d: Без доплат
  - type: faq
    title: Что будет, если…
    items:
      - q: Пойдёт дождь или снег?
        a: Бурим в любую погоду. При ливне переносим выезд на ближайший день без изменения срока отчёта.
      - q: Буровая не проедет на участок?
        a: Приедем с малогабаритной установкой. Цена не меняется.
      - q: Эксперт даст замечания?
        a: Ответим в течение 3 рабочих дней и внесём правки без доплат.
