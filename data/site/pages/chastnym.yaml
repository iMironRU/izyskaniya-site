# Страница «Частным застройщикам». Контент — демо из прототипа дизайнера (design/handoff/prototype/pages-data.js, ключ chastnym).
# Цены — метки {{от:профиль}}, {{цена:профиль}}, {{срок:профиль}}: их считает движок по data/site/prices.yaml.
# Схема блоков — src/site/blocks.ts; ссылки r: — ключи маршрутов из src/site/routes.ts.

title: Частным застройщикам
toc: true
blocks:
  - type: hero
    crumbs:
      - - Главная
        - home
      - Частным
    h1: Строите дом? Разберёмся, что нужно именно вам
    lead: Объясним простыми словами, какие изыскания обязательны, какие нет и сколько это стоит. Цена фиксируется в договоре.
    actions:
      - t: Рассчитать за 2 минуты
        r: raschet
        primary: true
      - t: Позвонить инженеру
        r: tel
  - type: timeline
    id: put
    title: Путь участка
    sub: Что понадобится от покупки до подключения газа
    items:
      - w: Шаг 1
        t: Покупка участка
        d: Проверка границ по выписке ЕГРН
        tag: по желанию
        p: '{{от:check_egrn}}'
      - w: Шаг 2
        t: Границы
        d: Вынос точек, если нет заборов или есть споры
        tag: по ситуации
        p: '{{от:granicy}}'
        r: uslugi
      - w: Шаг 3
        t: Топосъёмка
        d: Нужна проектировщику и газовой службе
        tag: обязательно
        p: '{{от:topo_dom}}'
        r: topo-gaz
      - w: Шаг 4
        t: Геология
        d: Покажет, какой фундамент выдержит грунт
        tag: рекомендуем
        p: '{{от:geo_dom}}'
        r: geologiya
      - w: Шаг 5
        t: Проект дома
        d: Архитектор проектирует по нашим отчётам
        tag: не наша работа
        p: —
      - w: Шаг 6
        t: Газ и вода
        d: Топоплан с сетями для техусловий
        tag: обязательно
        p: '{{от:topo_gaz}}'
        r: topo-gaz
  - type: compare
    id: nuzhna
    title: Нужна ли геология для частного дома
    text: >-
      Для ИЖС закон изыскания не требует. Без них фундамент подбирают по опыту соседей: либо с большим запасом, либо с риском трещин и
      осадки. Сравните, во что обходятся оба варианта.
    items:
      - v: '{{цена:geo_dom_10x12}}'
        k: геология под дом 10 × 12 м
      - v: от 600 000 ₽
        k: усиление фундамента после осадки
    note: 'По нашим объектам 2023–2025 годов: у каждого пятого участка геология изменила тип фундамента.'
  - type: cards
    id: pakety
    title: Типовые пакеты
    min: 260
    items:
      - kicker: Пакет
        t: Дом до 150 м²
        d: 3 скважины по 8 м, лаборатория, отчёт, топосъёмка М 1:500
        meta: '{{цена:pkg_dom150}} · {{срок:pkg_dom150}}'
        r: raschet
      - kicker: Пакет
        t: Дом с подвалом
        d: 4 скважины по 12 м, уровень грунтовых вод, отчёт, топосъёмка
        meta: '{{цена:pkg_basement}} · {{срок:pkg_basement}}'
        r: raschet
      - kicker: Пакет
        t: Баня или гараж
        d: 2 скважины по 6 м, лаборатория, краткий отчёт
        meta: '{{цена:pkg_light}} · {{срок:pkg_light}}'
        r: raschet
  - type: annotated
    id: otchet
    title: Что вы получите и как это читать
    ph: страница отчёта с колонкой скважины
    items:
      - t: Колонка скважины
        d: Слои грунта сверху вниз с глубинами. Чем ниже, тем старше и обычно плотнее грунт.
      - t: Уровень грунтовых вод
        d: Значок ▽ и глубина. Если вода выше подошвы фундамента, нужен дренаж или гидроизоляция.
      - t: ИГЭ — инженерно-геологический элемент
        d: Слой с одинаковыми свойствами. Проектировщик берёт из таблицы его несущую способность.
      - t: Рекомендации
        d: 'Последний раздел: какой фундамент подойдёт и на какую глубину его закладывать.'
  - type: cards
    id: otzyvy
    title: Отзывы частных клиентов
    min: 280
    items:
      - kicker: Берёзовский · 2025
        t: «Объяснили, почему не ленточный фундамент»
        d: Нашли торф под углом дома. Перешли на сваи и не переделывали потом.
        meta: Андрей, дом 10 × 12 м
      - kicker: Арамиль · 2025
        t: «Всё за одну поездку»
        d: Геология и топосъёмка в один день, отчёт на почту через неделю.
        meta: Елена, дом 9 × 9 м
      - kicker: Сысерть · 2024
        t: «Газовая приняла план с первого раза»
        d: Сами отвезли топоплан в газовую службу по доверенности.
        meta: Николай, газификация
  - type: faq
    id: faq
    title: Вопросы частных застройщиков
    items:
      - q: Можно ли сделать геологию после покупки проекта?
        a: Да, но лучше до. Тогда архитектор сразу заложит подходящий фундамент и не придётся переделывать проект.
      - q: Буровая испортит участок?
        a: Установка на гусеничном ходу оставляет следы как от небольшого трактора. Скважины засыпаем грунтом.
      - q: Сколько ждать отчёт?
        a: Обычно 7–10 рабочих дней от выезда.
      - q: Можно оплатить частями?
        a: 'Да: 50% после выезда, 50% при получении отчёта.'
