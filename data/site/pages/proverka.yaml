# Страница «Как проверить подрядчика». Контент — демо из прототипа дизайнера (design/handoff/prototype/pages-data.js, ключ proverka).
# Цены — метки {{от:профиль}}, {{цена:профиль}}, {{срок:профиль}}: их считает движок по data/site/prices.yaml.
# Схема блоков — src/site/blocks.ts; ссылки r: — ключи маршрутов из src/site/routes.ts.

title: Как проверить подрядчика
narrow: true
blocks:
  - type: hero
    crumbs:
      - - Главная
        - home
      - Как проверить подрядчика
    h1: Как проверить подрядчика за десять минут
    lead: 'На рынке изысканий много посредников: сайт есть, техники и лаборатории нет. Пять проверок помогут их отличить.'
  - type: checks
    items:
      - t: Членство в СРО изыскателей
        why: Без СРО отчёт не примут на экспертизе, а договор можно оспорить.
        how: Найдите компанию по ИНН в реестре НОПРИЗ. Статус должен быть «является членом», право — на изыскания.
        l: Реестр НОПРИЗ
        bad: В реестре другая компания, а договор предлагают заключить с «партнёром».
        ours: '{{sro}}, член с 2009 года'
      - t: Аттестат лаборатории
        why: Протоколы без аккредитации юридически не действительны.
        how: Проверьте номер аттестата в реестре Росаккредитации и область аккредитации.
        l: Реестр Росаккредитации
        bad: Лаборатория «партнёрская» или аттестат приостановлен.
        ours: '{{lab}}, действует до 2028'
      - t: Возраст и история юрлица
        why: Фирмы-однодневки исчезают вместе с авансом.
        how: Посмотрите дату регистрации и арбитражные дела по ОГРН.
        l: ЕГРЮЛ и картотека дел
        bad: Компании меньше года или много исков от заказчиков.
        ours: ОГРН {{ogrn}}, с 2009 года
      - t: Своя техника
        why: Посредник наценивает 30–50% и не контролирует сроки.
        how: Попросите фото установки с госномером и сверьте с договором.
        l: Страница «Техника»
        bad: Фото из интернета, отказ показать технику.
        ours: 4 буровые установки, номера на фото
      - t: Отзывы и объекты
        why: Реальные объекты можно проверить.
        how: Посмотрите отзывы на картах и попросите контакт заказчика.
        l: Яндекс Карты
        bad: Только отзывы на собственном сайте.
        ours: 4,9 на Яндекс Картах, 212 отзывов
