# Страница «Спасибо». Контент — демо из прототипа дизайнера (design/handoff/prototype/pages-data.js, ключ spasibo).
# Цены — метки {{от:профиль}}, {{цена:профиль}}, {{срок:профиль}}: их считает движок по data/site/prices.yaml.
# Схема блоков — src/site/blocks.ts; ссылки r: — ключи маршрутов из src/site/routes.ts.

title: Спасибо
noCta: true
narrow: true
blocks:
  - type: hero
    check: true
    h1: Заявка № 4127 принята
    lead: Инженер перезвонит в рабочее время, обычно в течение часа. Номер заявки пришлём в СМС.
  - type: rows
    title: Что будет дальше
    items:
      - t: Инженер проверит расчёт и уточнит допущения
        w: сегодня
      - t: Договор и выезд бригады на участок
        w: 2–3 дня
      - t: Технический отчёт в бумаге и PDF
        w: 7–10 дней
  - type: cards
    title: Пока ждёте
    min: 260
    items:
      - t: Образцы отчётов
        d: Посмотрите, что вы получите
        r: obrazcy
      - t: Как проверить подрядчика
        d: Пять проверок за десять минут
        r: proverka
