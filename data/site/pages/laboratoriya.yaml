# Страница «Лаборатория». Контент — демо из прототипа дизайнера (design/handoff/prototype/pages-data.js, ключ laboratoriya).
# Цены — метки {{от:профиль}}, {{цена:профиль}}, {{срок:профиль}}: их считает движок по data/site/prices.yaml.
# Схема блоков — src/site/blocks.ts; ссылки r: — ключи маршрутов из src/site/routes.ts.

title: Лаборатория
blocks:
  - type: hero
    crumbs:
      - - Главная
        - home
      - - О компании
        - o-kompanii
      - Лаборатория
    h1: Лаборатория грунтов и воды
    lead: Аккредитована в национальной системе. Испытываем пробы в день доставки, результаты — в протоколах с печатью лаборатории.
    facts:
      - k: Аттестат
        v: '{{lab}}'
      - k: Действует до
        v: '2028'
      - k: Испытаний в год
        v: 12 000
  - type: table
    title: Перечень испытаний
    cols:
      - Испытание
      - Метод
      - Срок
    rows:
      - - Влажность, плотность, границы пластичности
        - ГОСТ 5180-2015
        - 2 дня
      - - Гранулометрический состав
        - ГОСТ 12536-2014
        - 3 дня
      - - Компрессионные испытания
        - ГОСТ 12248.4-2020
        - 5 дней
      - - Сдвиговые испытания
        - ГОСТ 12248.1-2020
        - 5 дней
      - - Коррозионная агрессивность
        - ГОСТ 9.602-2016
        - 3 дня
      - - Химический анализ воды
        - ГОСТ 31861-2012
        - 3 дня
    normCol: 1
  - type: cards
    title: Оборудование
    min: 240
    items:
      - t: Компрессионные приборы
        d: 12 приборов, автоматизированный комплекс
        ph: фото оборудования
      - t: Сдвиговые приборы
        d: 6 приборов ГТ 1.2.6
        ph: фото оборудования
      - t: Сушильные шкафы и весы
        d: Поверены, свидетельства в документах
        ph: фото оборудования
  - type: people
    title: Люди
    items:
      - 'n': Мария Соколова
        r: Руководитель лаборатории
        x: Стаж 15 лет
      - 'n': Юлия Кузнецова
        r: Лаборант
        x: Стаж 7 лет
      - 'n': Роман Попов
        r: Лаборант
        x: Стаж 4 года
