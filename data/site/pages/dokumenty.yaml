# Страница «Документы». Контент — демо из прототипа дизайнера (design/handoff/prototype/pages-data.js, ключ dokumenty).
# Цены — метки {{от:профиль}}, {{цена:профиль}}, {{срок:профиль}}: их считает движок по data/site/prices.yaml.
# Схема блоков — src/site/blocks.ts; ссылки r: — ключи маршрутов из src/site/routes.ts.

title: Документы
blocks:
  - type: hero
    crumbs:
      - - Главная
        - home
      - - О компании
        - o-kompanii
      - Документы
    h1: Документы и реквизиты
    lead: Всё, что нужно для договора и тендера. Каждый документ можно проверить в открытом реестре.
  - type: docs
    all: Скачать все документы, 6,8 МБ
    items:
      - t: Выписка из реестра СРО
        m: PDF · 0,4 МБ
      - t: Аттестат аккредитации лаборатории
        m: PDF · 1,1 МБ
      - t: Сертификат ISO 9001
        m: PDF · 0,6 МБ
      - t: Устав
        m: PDF · 2,3 МБ
      - t: Свидетельства о поверке
        m: PDF · 1,9 МБ
      - t: Образец договора
        m: DOCX · 0,1 МБ
  - type: kv
    title: Реквизиты
    copy: true
    items:
      - - Полное наименование
        - '{{legal_name}}'
      - - ИНН / КПП
        - '{{inn}} / {{kpp}}'
      - - ОГРН
        - '{{ogrn}}'
      - - Юридический адрес
        - '{{address}}'
      - - Банк и счёт
        - '{{bank}}'
  - type: rows
    title: Проверить в реестрах
    items:
      - t: Реестр членов СРО
        d: НОПРИЗ, поиск по ИНН
        l: Открыть реестр
      - t: Реестр аккредитованных лиц
        d: Росаккредитация, аттестат {{lab}}
        l: Открыть реестр
      - t: ЕГРЮЛ
        d: ФНС, выписка по ОГРН
        l: Открыть реестр
