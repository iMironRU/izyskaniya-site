# Страница «Вопросы и ответы». Контент — демо из прототипа дизайнера (design/handoff/prototype/pages-data.js, ключ voprosy).
# Цены — метки {{от:профиль}}, {{цена:профиль}}, {{срок:профиль}}: их считает движок по data/site/prices.yaml.
# Схема блоков — src/site/blocks.ts; ссылки r: — ключи маршрутов из src/site/routes.ts.

title: Вопросы и ответы
narrow: true
blocks:
  - type: hero
    crumbs:
      - - Главная
        - home
      - Вопросы
    h1: Вопросы и ответы
  - type: faq
    search: true
    groups:
      - Все
      - Цены
      - Сроки
      - Документы
      - Частным
      - Проектировщикам
      - Оплата
    items:
      - g: Цены
        q: Сколько стоят изыскания под дом?
        a: Геология под типовой дом — {{от:geo_dom}}, с топосъёмкой — {{от:pkg_dom150}}.
      - g: Цены
        q: Может ли цена вырасти после договора?
        a: Нет, цена в договоре фиксированная.
      - g: Сроки
        q: Сколько ждать отчёт?
        a: Обычно 7–10 рабочих дней от выезда.
      - g: Сроки
        q: Можно срочно?
        a: Да, за 5 дней с наценкой 30%.
      - g: Документы
        q: Какие документы вы выдаёте?
        a: Технический отчёт в бумаге и PDF, протоколы лаборатории, для топосъёмки — DWG.
      - g: Частным
        q: Обязательна ли геология для ИЖС?
        a: Нет, но без неё фундамент подбирают без данных о грунте.
      - g: Частным
        q: Нужно ли присутствовать на выезде?
        a: Нет, достаточно обеспечить доступ на участок.
      - g: Проектировщикам
        q: Сопровождаете экспертизу?
        a: Да, отвечаем на замечания в течение 3 рабочих дней без доплат.
      - g: Проектировщикам
        q: Работаете по ТЗ заказчика?
        a: Да, составляем программу работ по вашему ТЗ и согласуем её.
      - g: Оплата
        q: Есть ли предоплата?
        a: Для частных клиентов нет. Для юрлиц — по договору.
      - g: Оплата
        q: Работаете с НДС?
        a: Да.
  - type: callout
    t: Не нашли ответ?
    d: Позвоните {{phone}} или оставьте номер — инженер перезвонит в течение часа.
    form: callback
