# Цены (design/handoff/pages/ceny.md). Все цифры считает движок по data/pricing.yaml.
title: Цены
lead: "Цены под ключ, {{v:vat}}. Выезд в пределах {{v:free_km}} от офиса входит в цену. Цифры считаются по той же модели, что и калькулятор."
calc_lead: Точная цена для вашего участка — за две минуты, без контактов
geology_matrix:
  title: Геология под частный дом
  sub: "Пятно застройки × этажность. Скважины, лаборатория и отчёт; выезд — по зоне."
  row_axis: Пятно застройки
  rows:
    - { label: "до 100 м²", dims: "10×10" }
    - { label: "100–150 м²", dims: "12×12" }
    - { label: "150–200 м²", dims: "14×14" }
    - { label: "200–300 м²", dims: "17×17" }
    - { label: "300–500 м²", dims: "22×22" }
  cols:
    - { label: 1 этаж, answers: { object_type: house, floors: "1" } }
    - { label: 2 этажа, answers: { object_type: house, floors: "2" } }
    - { label: 3 этажа, answers: { object_type: house, floors: "3" } }
    - { label: С подвалом, answers: { object_type: house_basement, floors: "2" } }
  base: { preset: dom, answers: { foundation: strip, distance_km: 20, need_topo: false } }
topo:
  title: Топография и геодезия
  rows:
    - { what: Топосъёмка для газа и воды, scale: "1:500", price: "{{от:topo_gaz}}", days: "{{срок:topo_gaz}}" }
    - { what: Топосъёмка для проекта дома, scale: "1:500", price: "{{от:topo_dom}}", days: "{{срок:topo_dom}}" }
    - { what: Топосъёмка крупного участка, scale: "1:1000", price: "{{от:topo_large}}", days: "от 7 дней" }
    - { what: Вынос границ участка, scale: "—", price: "{{от:granicy}}", days: "{{срок:granicy}}" }
    - { what: Вынос осей здания, scale: "—", price: "{{от:axes}}", days: "{{срок:axes}}" }
    - { what: Исполнительная съёмка фундамента, scale: "1:200", price: "{{от:asbuilt}}", days: "{{срок:asbuilt}}" }
other:
  title: Другие направления
  items: [ekologiya, gidromet, geofizika, obsledovanie, kadastr]
commercial:
  title: Коммерческие объекты
  lead: "Комплексные изыскания под экспертизу: геология, геодезия, экология. Точную смету считаем по ТЗ."
  rows:
    - { object: "Склад, ангар до 2 000 м²", volume: "6–8 скважин по 12–15 м", price: "{{от:warehouse}}" }
    - { object: МКД до 9 этажей, volume: "8–12 скважин по 20–25 м, зондирование", price: "{{от:mkd9}}" }
    - { object: МКД 10–25 этажей, volume: "12–20 скважин по 30–40 м", price: "{{от:mkd25}}" }
    - { object: "Газопровод, водовод", volume: "Скважины через 100–300 м по трассе", price: "{{от:geo_linear}}" }
    - { object: Промышленная площадка, volume: По программе работ, price: по ТЗ }
included:
  in: ["Выезд до {{v:free_km}} от офиса", Буровая установка и бригада, Лабораторные испытания, Отчёт в бумаге и PDF, Снятие замечаний экспертизы]
  out: ["Выезд дальше — по зонам (ниже)", Расчистка подъезда для буровой, "Срочность — {{v:urgent}}", Дополнительные экземпляры отчёта]
discounts:
  - { title: "Пакет «геология + топосъёмка»", value: "−{{v:bundle}}" }
payment: "Физлица: 50 % после выезда, 50 % при получении отчёта. Юрлица: по этапам договора, безналичный расчёт."
faq:
  - { q: Почему у других дешевле?, a: "Часто в низкую цену не входят лаборатория или выезд, либо работу передают субподрядчику. Сравнивайте состав работ и проверяйте СРО." }
  - { q: Может ли цена вырасти после договора?, a: "Нет: цена фиксируется в договоре. Меняется, только если меняется объём по вашему решению." }
  - { q: Есть ли предоплата?, a: "Для физлиц — нет: оплата после выезда и при получении отчёта." }
  - { q: Работаете с НДС?, a: "Цены на сайте — {{v:vat}}. Условия для юрлиц — в договоре." }
