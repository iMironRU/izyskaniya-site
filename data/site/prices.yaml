# Профили цен для текстов сайта: метки {{от:ключ}}, {{цена:ключ}}, {{срок:ключ}} в data/site/**.
# Считаются тем же движком, что калькулятор: правка data/pricing.yaml меняет калькулятор, «Цены» и карточки.
#   preset + answers — расчёт калькулятора (preset — сценарий из data/presets.yaml);
#   catalog — строка каталога data/pricing.yaml;
#   rate — тариф data/pricing.yaml (цена за единицу).
#
# Кроме профилей, в тексте работают переменные модели цен {{v:…}}: bundle (скидка пакета),
# urgent (наценка «быстрее»), free_km (радиус бесплатного выезда), vat (НДС).

geo_dom:            { preset: dom, answers: { object_type: house, floors: "1", dims: "10×10", foundation: strip, distance_km: 20, need_topo: false } }
