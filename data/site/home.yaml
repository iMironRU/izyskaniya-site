    - { type: Колонка, title: Колонка скважины, meta: "Отчёт № 214-ИГИ · 10 м" }
    - { type: Протокол, title: Протокол лабораторных испытаний, meta: ГОСТ 5180-2015 }
    - { type: Экспертиза, title: Положительное заключение, meta: "Госэкспертиза, 2025" }
