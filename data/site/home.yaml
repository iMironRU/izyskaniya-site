# Главная (design/handoff/pages/home.md). Контент — демо из прототипа.
kicker: "Инженерные изыскания · {{region}}"
h1: Геология, геодезия и экология для строительства
lead: Своя буровая техника и аттестованная лаборатория. Отчёты проходят государственную экспертизу.
scenarios:
  - { title: Строю дом, text: Геология и топосъёмка под фундамент, r: "raschet?s=dom", price: "{{от:geo_dom}}" }
  - { title: Проектирую объект, text: Изыскания под экспертизу, r: proektirovshchikam, price: по ТЗ }
  - { title: Топосъёмка для газа или воды, text: План М 1:500 для подключения, r: topo-gaz, price: "{{от:topo_gaz}}" }
  - { title: Границы и межевание, text: Вынос точек, межевой план, r: "raschet?s=granicy", price: "{{от:granicy}}" }
borehole:
  title: Скважина 1
  elevation: "Абс. отм. 254,30"
  water: 3.4
  layers:
    - { to: 0.3, name: Почвенный слой, pattern: soil }
    - { to: 2.8, name: Суглинок, note: тугопластичный, pattern: loam }
    - { to: 5.6, name: Песок, note: средней крупности, pattern: sand }
    - { to: 10, name: Глина, note: полутвёрдая, pattern: clay }
how:
  title: Как это работает
  items:
    - { title: Заявка и расчёт, term: 15 минут, text: Калькулятор на сайте или звонок инженеру. Цена фиксируется в договоре. }
    - { title: Договор и выезд, term: 1–3 дня, text: Приезжаем со своей буровой установкой и геодезическим оборудованием. }
    - { title: Лаборатория, term: 3–5 дней, text: Испытываем пробы грунта и воды в собственной аттестованной лаборатории. }
    - { title: Отчёт, term: 2 дня, text: Технический отчёт в бумаге и PDF с рекомендациями по фундаменту. }
samples:
  title: Что вы получите
  sub: Страницы из наших отчётов. Персональные данные заказчиков скрыты.
  items:
