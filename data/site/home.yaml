checks:
  title: Проверьте нас до договора
  lead: На рынке много посредников без своей техники и лаборатории. Пять проверок занимают десять минут.
  items:
    - { title: Членство в СРО изыскателей, note: "{{sro}}", link: { label: Реестр НОПРИЗ, href: "https://reestr.nopriz.ru/" } }
    - { title: Аттестат лаборатории, note: "{{lab}}", link: { label: Росаккредитация, href: "https://pub.fsa.gov.ru/" } }
    - { title: Юрлицо старше трёх лет, note: "ОГРН {{ogrn}}, с {{founded}} года", link: { label: ЕГРЮЛ, href: "https://egrul.nalog.ru/" } }
    - { title: Своя буровая техника, note: "4 установки, фото с номерами", link: { label: Страница «Техника», href: tehnika } }
    - { title: Отзывы на картах, note: "{{rating}}", link: { label: Яндекс Карты, href: "https://yandex.ru/maps/" } }
faq:
  title: Частые вопросы
  items:
    - { q: Обязательна ли геология для частного дома?, a: "Для ИЖС формально нет, но без неё фундамент подбирают «на глаз». Исправить осадку дома стоит в десятки раз дороже изысканий." }
    - { q: Сколько стоят изыскания под дом?, a: "Геология под типовой дом — {{от:geo_dom}}, с топосъёмкой — {{от:pkg_dom150}}. Точную цену для вашего участка покажет калькулятор." }
    - { q: Сколько времени занимает работа?, a: "От заявки до отчёта — около недели: день на бурение, несколько дней на лабораторию и отчёт." }
    - { q: Пройдёт ли отчёт экспертизу?, a: "Отчёты готовим по СП 47.13330.2016 и СП 446.1325800.2019. Замечания экспертизы снимаем без доплат." }
    - { q: Что нужно подготовить с моей стороны?, a: "Кадастровый номер или адрес участка и проезд для буровой установки. Эскиз дома поможет поставить скважины точнее." }
    - { q: Работаете ли зимой?, a: "Да, бурим круглый год. Зимой иногда нужно расчистить подъезд от снега." }
