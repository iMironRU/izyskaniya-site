# Общие вопросы. Порядок в файле = порядок показа.
#
# Ветки (сценарии с главной) задаёт скрытый ответ branch — его ставит пресет из data/presets.yaml.
# show_if — вопрос нужен для расчёта при этих ответах; ask_if — задаётся ли он в этой ветке.
# Незадаваемый вопрос берёт default (или unknown.assume) без пометки «допущение».
# У каждого задаваемого вопроса есть «не знаю» (unknown): консервативное допущение, явно видное в результате.

- id: branch
  service: common
  title: Сценарий
  kind: choice
  options:
    - { value: general, label: Изыскания }
    - { value: dom, label: Геология под дом }
    - { value: proekt, label: Изыскания под проект }
    - { value: topo, label: Топосъёмка для сетей }
    - { value: granicy, label: Границы участка }
  ask_if: { any: [] }
  default: general

- id: services
  service: common
  title: Что нужно сделать?
  summary: Услуги
  kind: multi
  options:
    - { value: geology, label: Геология, hint: "Скважины и свойства грунтов — для расчёта фундамента" }
    - { value: topo, label: Топосъёмка, hint: "План участка с рельефом и коммуникациями" }
  ask_if: { q: branch, in: [general] }
  unknown:
    label: Не знаю, что нужно
    assume: [geology, topo]
    note: "Для строительства обычно нужны оба вида изысканий. Посчитали оба, инженер уточнит."
    demo: false

- id: object_type
  service: geology
  title: Что строите?
  summary: Объект
  why:
    text: От типа объекта зависит, сколько нужно скважин и какой глубины.
  kind: choice
  options:
    - { value: house, label: Жилой дом, hint: "Каркасный, кирпичный, из бруса или газобетона" }
    - { value: house_basement, label: Дом с подвалом, hint: "Или с цокольным этажом: скважины глубже на 2 м" }
    - { value: light, label: "Баня, гараж, беседка", hint: "Лёгкая постройка, хватит одной-двух скважин" }
    - { value: commercial, label: Коммерческий или многоквартирный объект, hint: "Цену покажем вилкой", show_if: { q: branch, in: [general] } }
  show_if: { q: services, includes: geology }
  ask_if: { q: branch, in: [general, dom] }
  unknown:
    label: Не знаю
    assume: house
    note: "Примем жилой дом и отметим это в расчёте."
    demo: false
