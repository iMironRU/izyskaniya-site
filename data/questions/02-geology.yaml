- id: floors
  service: geology
  title: Сколько этажей?
  summary: Этажность
  hint: Вместе с мансардой.
  why:
    text: От нагрузки на грунт зависит глубина скважин.
    norm: { code: "СП 47.13330.2016" }
  kind: choice
  options:
    - { value: "1", label: 1 этаж }
    - { value: "2", label: 2 этажа }
    - { value: "3", label: 3 этажа и выше, hint: "Нагрузка больше — скважины глубже" }
  show_if: { all: [{ q: services, includes: geology }, { q: object_type, in: [house, house_basement] }] }
  ask_if: { q: branch, in: [general, dom] }
  unknown:
    label: Не знаю
    assume: "2"
    note: "Приняли два этажа — так чаще всего строят."
    demo: true

- id: floors_commercial
  service: geology
  title: Сколько этажей в здании?
  summary: Этажность
  why:
    text: От нагрузки на грунт зависит глубина скважин.
    norm: { code: "СП 47.13330.2016" }
  kind: choice
  options:
    - { value: low, label: до 5 этажей }
    - { value: mid, label: 6–9 этажей }
    - { value: high, label: 10 этажей и выше }
  show_if: { all: [{ q: services, includes: geology }, { q: object_type, in: [commercial] }] }
  unknown:
    label: Не знаю
    assume: high
    note: "Приняли 10 этажей и выше — глубина скважин с запасом."
    demo: true

- id: dims
  service: geology
  title: Какие габариты у дома?
  summary: Пятно
  hint: Длина и ширина пятна застройки в метрах — по проекту или примерно.
  why:
    text: От площади пятна зависит, сколько скважин поставить по контуру здания.
    norm: { code: "СП 47.13330.2016" }
  kind: dims
  number: { unit: м, min: 2, max: 300, step: 0.5 }
  show_if: { q: services, includes: geology }
  unknown:
    label: Не знаю
    assume: "12×10"
    note: "Приняли пятно 12 × 10 м."
    demo: true

- id: foundation
  service: geology
  title: Какой фундамент планируете?
  summary: Фундамент
  why:
    text: Под сваи нужны скважины глубже, чем под плиту или ленту.
  kind: choice
  options:
    - { value: slab, label: Плита }
    - { value: strip, label: Ленточный }
    - { value: piles, label: Сваи, hint: "Винтовые или буронабивные" }
  show_if: { all: [{ q: services, includes: geology }, { q: object_type, in: [house, house_basement, light] }] }
  ask_if: { q: branch, in: [general, dom] }
  unknown:
    label: Не знаю
    assume: piles
    note: "Приняли сваи — для них нужны самые глубокие скважины. Если будет плита или лента, станет дешевле."
    demo: true
