# Топосъёмка. В ветке «дом» (need_topo) не задаётся: берутся default — план участка до 15 соток, М 1:500.

- id: topo_purpose
  service: topo
  title: Для чего нужна топосъёмка?
  summary: Цель съёмки
  kind: choice
  options:
    - { value: house, label: Для проекта дома или ГПЗУ }
    - { value: gas, label: Для газа, hint: "Для техусловий и проекта газопровода" }
    - { value: water, label: Для воды или канализации }
    - { value: landscape, label: Для ландшафта или благоустройства }
  show_if: { any: [{ q: services, includes: topo }, { q: need_topo, in: [true] }] }
  ask_if: { q: branch, in: [general, topo] }
  default: house
  unknown:
    label: Не знаю
    assume: house
    note: "Посчитали как для проекта дома."
    demo: false

- id: topo_geometry
  service: topo
  title: Что снимаем?
  summary: Что снимаем
  kind: choice
  options:
    - { value: area, label: Участок, hint: "Площадная съёмка" }
    - { value: linear, label: Трассу, hint: "Газопровод, водопровод, дорога" }
    - { value: none, label: Только вынос границ, hint: "Без топосъёмки", show_if: { q: branch, in: [granicy] } }
  show_if: { any: [{ q: services, includes: topo }, { q: need_topo, in: [true] }] }
  ask_if: { q: branch, in: [general, topo] }
  default: area
  unknown:
    label: Не знаю
    assume: area
    note: "Посчитали съёмку участка."
    demo: false

- id: area_ha
  service: topo
  title: Какая площадь участка?
  summary: Площадь
  hint: В гектарах. 10 соток = 0,1 га.
  kind: number
  number: { unit: га, min: 0.01, max: 500, step: 0.01 }
  show_if:
    all:
      - { any: [{ q: services, includes: topo }, { q: need_topo, in: [true] }] }
      - { q: topo_geometry, in: [area] }
  ask_if: { q: branch, in: [general, topo] }
  default: 0.15
  unknown:
    label: Не знаю
    assume: 0.25
    note: "Приняли 25 соток."
    demo: true

- id: length_km
  service: topo
  title: Какая длина трассы?
  summary: Трасса
  kind: number
  number: { unit: км, min: 0.05, max: 200, step: 0.05 }
  show_if:
    all:
      - { any: [{ q: services, includes: topo }, { q: need_topo, in: [true] }] }
      - { q: topo_geometry, in: [linear] }
  unknown:
    label: Не знаю
    assume: 1
    note: "Приняли трассу 1 км."
    demo: true

- id: scale
  service: topo
  title: Какой нужен масштаб?
  summary: Масштаб
  hint: Для частного дома и сетей обычно 1:500.
  kind: choice
  options:
    - { value: "500", label: "1:500", hint: "Самый подробный" }
    - { value: "1000", label: "1:1000" }
    - { value: "2000", label: "1:2000", hint: "Для больших территорий" }
  show_if:
    all:
      - { any: [{ q: services, includes: topo }, { q: need_topo, in: [true] }] }
      - { q: topo_geometry, in: [area] }
  ask_if: { q: branch, in: [general] }
  default: "500"
  unknown:
    label: Не знаю
    assume: "500"
    note: "Приняли 1:500 — его принимают для проекта дома и сетей."
    demo: false

- id: utilities
  service: topo
  title: Нужно снять подземные коммуникации?
  summary: Коммуникации
  hint: Трубы и кабели под землёй.
  kind: boolean
  show_if:
    all:
      - { any: [{ q: services, includes: topo }, { q: need_topo, in: [true] }] }
      - { q: topo_geometry, in: [area, linear] }
  ask_if: { q: branch, in: [general, topo] }
  default: false
  unknown:
    label: Не знаю
    assume: true
    note: "Включили съёмку коммуникаций: без неё план часто не принимают."
    demo: false

- id: trees
  service: topo
  title: Нужна подеревная съёмка?
  summary: Подеревная
  hint: Каждое дерево на плане, с породой и диаметром.
  kind: boolean
  show_if:
    all:
      - { any: [{ q: services, includes: topo }, { q: need_topo, in: [true] }] }
      - { q: topo_geometry, in: [area] }
  ask_if: { q: branch, in: [general] }
  default: false
  unknown:
    label: Не знаю
    assume: false
    note: "Не включили. Понадобится, если на участке есть деревья под вырубку."
    demo: false

- id: stakeout
  service: topo
  title: Нужно вынести границы участка?
  summary: Вынос границ
  hint: Поставим межевые знаки на углах участка.
  kind: boolean
  show_if: { any: [{ q: services, includes: topo }, { q: need_topo, in: [true] }] }
  ask_if: { q: branch, in: [general] }
  default: false
  unknown:
    label: Не знаю
    assume: false
    note: "Не включили вынос границ."
    demo: false

- id: stakeout_points
  service: topo
  title: Сколько точек выносим?
  summary: Точек
  hint: Обычно по углам участка — 4.
  kind: number
  number: { unit: точка, min: 1, max: 100, step: 1 }
  show_if:
    all:
      - { any: [{ q: services, includes: topo }, { q: need_topo, in: [true] }] }
      - { q: stakeout, in: [true] }
  unknown:
    label: Не знаю
    assume: 4
    note: "Приняли 4 точки."
    demo: true

- id: approvals
  service: topo
  title: Согласовать план с эксплуатирующими службами?
  summary: Согласования
  hint: Газ, вода, электросети — если этого требует проектировщик.
  kind: boolean
  show_if:
    all:
      - { any: [{ q: services, includes: topo }, { q: need_topo, in: [true] }] }
      - { q: topo_geometry, in: [area, linear] }
  ask_if: { q: branch, in: [general, topo] }
  default: false
  unknown:
    label: Не знаю
    assume: true
    note: "Включили согласования: для техусловий они обычно нужны."
    demo: false
